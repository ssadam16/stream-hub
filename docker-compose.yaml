  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: config-server-Dockerfile.dev
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - streamhub-network


  code-executor-service:
    container_name: code-executor-service
    build:
      context: .
      dockerfile: code-executor-service-Dockerfile.dev
    ports:
      - "8085:8085"
    volumes:
      - ./docker-containers:/code-execution-temp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
#      code-executor-service-postgres:
#        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      TASK_SERVICE_URI: http://task-service:8083/api
      BIND_PATH: ${BIND_PATH}
      #      SPRING_DATASOURCE_USERNAME: postgres
      #      SPRING_DATASOURCE_URL: jdbc:postgresql://code-executor-service-postgres:5432/code-executor-service-db
      #      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network

  solution-service:
    container_name: solution-service
    build:
      context: .
      dockerfile: solution-service-Dockerfile.dev
    ports:
      - "8084:8084"
    depends_on:
      solution-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      TASK_SERVICE_URI: http://task-service:8083/api/tasks
      SPRING_DATASOURCE_URL: jdbc:postgresql://solution-service-postgres:5432/solution-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service-Dockerfile.dev
    ports:
      - "8081:8081"
    depends_on:
      user-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/user-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  task-service:
    container_name: task-service
    build:
      context: .
      dockerfile: task-service-Dockerfile.dev
    ports:
      - "8083:8083"
    depends_on:
      task-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-service-postgres:5432/task-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway-Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      USER_SERVICE_URI: http://user-service:8081
      SOLUTION_SERVICE_URI: http://solution-service:8084
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_URL: http://keycloak:8090
    networks:
      - streamhub-network


  kafka-1:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://${HOSTNAME:-localhost}:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data1:/bitnami/kafka
    networks:
      - streamhub-network

  kafka-2:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9090, EXTERNAL://${HOSTNAME:-localhost}:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data2:/bitnami/kafka
    networks:
      - streamhub-network

  kafka-3:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9096:9096"
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9090, EXTERNAL://${HOSTNAME:-localhost}:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data3:/bitnami/kafka
    networks:
      - streamhub-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: on-failure
    ports:
      - "8989:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: Stream hub Kafka Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
      KAFKA_CLUSTERS_0_METRICS_PORT: 9090
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CLUSTERS_0_TOPICS: ".*"
      KAFKA_CLUSTERS_0_TOPICS_FILTER: ".*"
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    networks:
      - streamhub-network


  keycloak-postgres:
    image: postgres:latest
    container_name: keycloak-postgres
    ports:
      - '5444:5432'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - streamhub-network
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8090
      KC_HOSTNAME_STRICT: false
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
    ports:
      - "8090:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - streamhub-network
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root123}
      MONGO_INITDB_DATABASE: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - streamhub-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-root123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-root123}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD:-root123}
    depends_on:
      - mongodb
    networks:
      - streamhub-network

volumes:
  user-service-postgres-data:
  task-service-postgres-data:
  solution-service-postgres-data:
  kafka_data1:
  kafka_data2:
  kafka_data3:
  keycloak_postgres_data:
  mongo_data:

networks:
  streamhub-network:
    driver: bridge