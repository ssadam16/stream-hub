services:
  user-service-postgres:
    container_name: user-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - user-service-postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  task-service-postgres:
    container_name: task-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5433:5432"
    volumes:
      - task-service-postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  solution-service-postgres:
    container_name: solution-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5434:5432"
    volumes:
      - solution-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: solution-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: config-server-Dockerfile.dev
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - streamhub-network


  solution-service:
    container_name: solution-service
    build:
      context: .
      dockerfile: solution-service-Dockerfile.dev
    ports:
      - "8084:8084"
    depends_on:
      solution-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://solution-service-postgres:5432/solution-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service-Dockerfile.dev
    ports:
      - "8081:8081"
    depends_on:
      user-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/user-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  task-service:
    container_name: task-service
    build:
      context: .
      dockerfile: task-service-Dockerfile.dev
    ports:
      - "8082:8082"
    depends_on:
      task-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-service-postgres:5432/task-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway-Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      USER_SERVICE_URI: http://user-service:8081
    networks:
      - streamhub-network

volumes:
  user-service-postgres_data:
  task-service-postgres_data:
  solution-service-postgres-data:

networks:
  streamhub-network:
    driver: bridge