  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: config-server-Dockerfile.dev
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - streamhub-network


  executor-code-service:
    container_name: code-executor-service
    build:
      context: .
      dockerfile: code-executor-service-Dockerfile.dev
    ports:
      - "8085:8085"
    depends_on:
#      code-executor-service-postgres:
#        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
#      SPRING_DATASOURCE_USERNAME: postgres
#      SPRING_DATASOURCE_URL: jdbc:postgresql://code-executor-service-postgres:5432/code-executor-service-db
#      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network

  solution-service:
    container_name: solution-service
    build:
      context: .
      dockerfile: solution-service-Dockerfile.dev
    ports:
      - "8084:8084"
    depends_on:
      solution-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://solution-service-postgres:5432/solution-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service-Dockerfile.dev
    ports:
      - "8081:8081"
    depends_on:
      user-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/user-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  task-service:
    container_name: task-service
    build:
      context: .
      dockerfile: task-service-Dockerfile.dev
    ports:
      - "8082:8082"
    depends_on:
      task-service-postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-service-postgres:5432/task-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway-Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      USER_SERVICE_URI: http://user-service:8081
      SOLUTION_SERVICE_URI: http://solution-service:8084
    networks:
      - streamhub-network

  kafka-1:
    container_name: kafka-1
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID:-kDSAOO140Dx_CZSDKFAZZva}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://${HOSTNAME:-localhost}:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka1_data:/bitnami/kafka
    networks:
      - streamhub-network



  kafka-2:
    container_name: kafka-2
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID:-kDSAOO140Dx_CZSDKFAZZva}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9090,EXTERNAL://${HOSTNAME:-localhost}:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka2_data:/bitnami/kafka
    networks:
      - streamhub-network

  kafka-3:
    container_name: kafka-3
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    ports:
      - "9096:9096"
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID:-kDSAOO140Dx_CZSDKFAZZva}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9090,EXTERNAL://${HOSTNAME:-localhost}:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka3_data:/bitnami/kafka
    networks:
      - streamhub-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: on-failure
    ports:
      - "8989:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: Solution Kafka Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
      KAFKA_CLUSTERS_0_METRICS_PORT: 9090
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CLUSTERS_0_TOPICS: ".*"
      KAFKA_CLUSTERS_0_TOPICS_FILTER: ".*"
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    networks:
      - streamhub-network

volumes:
  user-service-postgres-data:
  task-service-postgres-data:
  solution-service-postgres-data:
  kafka2_data:
  kafka1_data:
  kafka3_data:

networks:
  streamhub-network:
    driver: bridge