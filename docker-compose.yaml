services:
  task-service-postgres:
    container_name: task-service-postgres
    image: postgres:latest
    restart: on-failure
    volumes:
      - task-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  solution-service-postgres:
    container_name: solution-service-postgres
    image: postgres:latest
    restart: on-failure
    volumes:
      - solution-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: solution-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  keycloak-postgres:
    image: postgres:latest
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - streamhub-network
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: mongo-db
    volumes:
      - mongo_data:/data/db
    networks:
      - streamhub-network

  kafka-1:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://${HOSTNAME:-localhost}:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data1:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network

  kafka-2:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9090,EXTERNAL://${HOSTNAME:-localhost}:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data2:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network

  kafka-3:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9090,EXTERNAL://${HOSTNAME:-localhost}:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data3:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
    ports:
      - "8090:8080"  # нужен снаружи — фронт логинится через него
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import

  task-service:
    container_name: task-service
    build:
      context: .
      dockerfile: task-service-Dockerfile.dev
    depends_on:
      task-service-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-service-postgres:5432/task-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      SOLUTION_SERVICE_URI: http://solution-service:8084
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/stream-hub
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/stream-hub/protocol/openid-connect/certs
    networks:
      - streamhub-network

  solution-service:
    container_name: solution-service
    build:
      context: .
      dockerfile: solution-service-Dockerfile.dev
    depends_on:
      solution-service-postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_USERNAME: postgres
      TASK_SERVICE_URI: http://task-service:8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://solution-service-postgres:5432/solution-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
    networks:
      - streamhub-network

  code-executor-service:
    container_name: code-executor-service
    build:
      context: .
      dockerfile: code-executor-service-Dockerfile.dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      TASK_SERVICE_URI: http://task-service:8083
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network

  plagiarism-service:
    container_name: plagiarism-service
    build:
      context: .
      dockerfile: plagiarism-service-Dockerfile.dev
    depends_on:
      mongodb:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/mongo-db?authSource=admin
    networks:
      - streamhub-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway-Dockerfile.dev
    ports:
      - "8080:8080"  # единственная точка входа для клиентов
    depends_on:
      user-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      USER_SERVICE_URI: http://user-service:8081
      TASK_SERVICE_URI: http://task-service:8083
      PLAGIARISM_SERVICE_URI: http://plagiarism-service:8086
      SOLUTION_SERVICE_URI: http://solution-service:8084
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_URI: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: gateway-client
      OTEL_HOST: otel-collector
    networks:
      - streamhub-network
    restart: on-failure

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - streamhub-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - streamhub-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"  # дашборды нужны снаружи
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - streamhub-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml
    depends_on:
      - tempo
    networks:
      - streamhub-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo/config.yaml" ]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    networks:
      - streamhub-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - streamhub-network

volumes:
  task-service-postgres-data:
  solution-service-postgres-data:
  kafka_data1:
  kafka_data2:
  kafka_data3:
  keycloak_postgres_data:
  mongo_data:
  grafana-data:
  tempo-data:
  prometheus-data:

networks:
  streamhub-network:
    driver: bridge
