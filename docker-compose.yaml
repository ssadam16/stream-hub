services:
  user-service-postgres:
    container_name: user-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - user-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  task-service-postgres:
    container_name: task-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5433:5432"
    volumes:
      - task-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

  solution-service-postgres:
    container_name: solution-service-postgres
    image: postgres:latest
    restart: on-failure
    ports:
      - "5434:5432"
    volumes:
      - solution-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: solution-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network

#  code-executor-service-postgres:
#    container_name: code-executor-service-postgres
#    image: postgres:latest
#    restart: on-failure
#    ports:
#      - "5435:5432"
