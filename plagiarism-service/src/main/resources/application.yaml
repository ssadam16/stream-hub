spring:
  application:
    name: plagiarism-service
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/stream-hub}     # для проверки iss в токене
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/stream-hub/protocol/openid-connect/certs}   # для скачивания публичного ключа

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    consumer:
      group-id: plagiarism-service-group
      properties:
        spring.json.trusted.packages: "com.technokratos.common.events"
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
      retries: 3
      acks: all
    listener:
      missing-topics-fatal: false
    #      max-attempts: 4
    #      backoff:
    #        exponential:
    #          initial: 1000
    #          multiplier: 5
    #          max: 30000

  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME:nongrataqqq}:${MONGO_ROOT_PASSWORD:235094}@localhost:27017/mongo-db?authSource=admin

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false


security:
  starter:
    permit-all:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /webjars/**
      - /swagger-resources/**
      - /actuator/**



otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
  resource:
    attributes:
      service.name: ${spring.application.name}


server:
  port: 8086

