import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    set('springCloudVersion', "2025.0.1")
    set('otelInstrumentationVersion', "2.10.0")
}

group = 'com.technokratos'
version = '0.0.1-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${otelInstrumentationVersion}"
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// только для сервисов
configure(subprojects.findAll { it.name != 'common' && it.name != 'security-spring-boot-starter' }) {
    apply plugin: 'org.springframework.boot'

    bootJar {
        enabled = true
        archiveClassifier = ''
    }

    jar {
        enabled = false
    }

    dependencies {
        implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
        implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}