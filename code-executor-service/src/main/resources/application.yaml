docker:
  http-client:
    max-connections: 100
    connection-timeout: 45
    response-timeout: 60
  images:
    java: eclipse-temurin:21-jdk
    python: python:3.12-slim
    cpp: gcc:13-bookworm
    go: golang:1.22-alpine

spring:
  profiles:
    active: dev
  application:
    name: code-executor-service
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s


  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    consumer:
      group-id: code-executor-group
      properties:
        spring.json.trusted.packages: "com.technokratos.common.events"
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
      retries: 3
      acks: all
    listener:
      missing-topics-fatal: false
      concurrency: 4
#      max-attempts: 4
#      backoff:
#        exponential:
#          initial: 1000
#          multiplier: 5
#          max: 30000

logging:
  level:
    com.technokratos.codeexecutorservice: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.kafka.listener.KafkaMessageListenerContainer: INFO

executor:
  max-concurrent-containers: 4

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
  resource:
    attributes:
      service.name: ${spring.application.name}


services:
  task-service:
    uri: ${TASK_SERVICE_URI:http://localhost:8083}

server:
  port: 8085