server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - AddRequestHeader=X-Request-Example, Gateway-Request
                - AddResponseHeader=X-Response-Example, Gateway-Response

            - id: solution-service
              uri: ${SOLUTION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/solutions/**
              filters:
                - AddRequestHeader=X-Request-Example, Gateway-Request
                - AddResponseHeader=X-Response-Example, Gateway-Response

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8090/realms/myrealm
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            client-secret: RWuBpGsfRQAHGvK5qeKSwPtmWpa3wXUQ
            authorization-grant-type: password
            scope:
              - openid
              - email
              - profile
              - roles

keycloak:
  client-secret: ${KEYCLOAK_CLIENT_SECRET:RWuBpGsfRQAHGvK5qeKSwPtmWpa3wXUQ}

services:
  user-service:
    uri: ${USER_SERVICE_URI:http://localhost:8081}
  keycloak-service:
    uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8090}

logging:
  level:
    org.springframework.security: DEBUG
    com.technokratos.apigateway: debug