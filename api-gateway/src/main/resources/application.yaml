server:
  port: 8080

spring:
  application:
    name: api-gateway

  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:gateway-client}
            client-secret: ${GATEWAY_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile, email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/stream-hub}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8090}/realms/stream-hub/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8090}/realms/stream-hub/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8090}/realms/stream-hub/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username


  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        fail-fast: false
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${random.uuid}
    gateway:
      server:
        webflux:
          routes:
            - id: solution-service
              uri: lb://solution-service
              predicates:
                - Path=/api/v1/solutions/**
              filters:
                - TokenRelay=

            - id: task-service
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tasks/**
              filters:
                - TokenRelay=

            - id: plagiarism-service
              uri: lb://plagiarism-service
              predicates:
                - Path=/api/v1/plagiarism/**
              filters:
                - TokenRelay=

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/statistics/**
              filters:
                - TokenRelay=

            - id: task-service-admin
              uri: lb://task-service
              predicates:
                - Path=/api/v1/admin/tasks/**
              filters:
                - TokenRelay=

            - id: tags
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tags/**
              filters:
                - TokenRelay=

            - id: task-service-docs
              uri: lb://task-service
              predicates:
                - Path=/v3/api-docs/task-service
              filters:
                - RewritePath=/v3/api-docs/task-service, /v3/api-docs

            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: solution-service-docs
              uri: lb://solution-service
              predicates:
                - Path=/v3/api-docs/solution-service
              filters:
                - RewritePath=/v3/api-docs/solution-service, /v3/api-docs

            - id: plagiarism-service-docs
              uri: lb://plagiarism-service
              predicates:
                - Path=/v3/api-docs/plagiarism-service
              filters:
                - RewritePath=/v3/api-docs/plagiarism-service, /v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    urls:
      - name: task-service
        url: /v3/api-docs/task-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: solution-service
        url: /v3/api-docs/solution-service
      - name: plagiarism-service
        url: /v3/api-docs/plagiarism-service
  api-docs:
    enabled: true

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/stream-hub}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/stream-hub/protocol/openid-connect/certs}

otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
  resource:
    attributes:
      service.name: ${spring.application.name}
  sdk:
    disabled: true

logging:
  level:
    org.springframework.security: INFO
    com.technokratos.apigateway: DEBUG