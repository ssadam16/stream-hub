server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: solution-service
              uri: ${SOLUTION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/solutions/**
            - id: task-service
              uri: ${TASK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/tasks/**

keycloak:
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

services:
  user-service:
    uri: ${USER_SERVICE_URI:http://localhost:8081}
  keycloak-service:
    uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8090}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
  resource:
    attributes:
      service.name: ${spring.application.name}

logging:
  level:
    org.springframework.security: INFO
    com.technokratos.apigateway: DEBUG