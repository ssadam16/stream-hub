stages:
  - test
  - docker
  - deploy

variables:
  REGISTRY: registry.gitlab.com/nongrataqqq/stream-hub
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

# ──────────────────────────────────────────
# STAGE 1 — тесты
# ──────────────────────────────────────────
test:
  stage: test
  image: gradle:8.10-jdk21
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    SPRING_PROFILES_ACTIVE: test
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  cache:
    - key:
        files:
          - build.gradle
          - settings.gradle
      paths:
        - .gradle/caches/
        - .gradle/wrapper/
        - .gradle/notifications/
      policy: pull-push
    - key: gradle-build-$CI_COMMIT_REF_SLUG
      paths:
        - build/
        - "*/build/"
      policy: pull-push
  script:
    - gradle test --no-daemon --build-cache --stacktrace

# ──────────────────────────────────────────
# STAGE 2 — сборка и публикация образов
# ──────────────────────────────────────────
.docker_build: &docker_build
  stage: docker
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] && docker pull $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA 2>/dev/null; then
        echo "✓ Образ уже собран в MR, делаем promote → latest"
        docker tag $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA $REGISTRY/$SERVICE_NAME:latest
        docker push $REGISTRY/$SERVICE_NAME:latest
        exit 0
      fi

      echo "→ Собираем с нуля (с кэшем)"
      docker pull $REGISTRY/$SERVICE_NAME:buildcache 2>/dev/null || true
      docker pull $REGISTRY/$SERVICE_NAME:latest 2>/dev/null || true

      EXTRA_TAGS=""
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        EXTRA_TAGS="-t $REGISTRY/$SERVICE_NAME:latest"
      fi

      docker build \
        --pull \
        --cache-from $REGISTRY/$SERVICE_NAME:buildcache \
        --cache-from $REGISTRY/$SERVICE_NAME:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -f ${SERVICE_NAME}/Dockerfile \
        -t $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA \
        -t $REGISTRY/$SERVICE_NAME:buildcache \
        $EXTRA_TAGS \
        .

      docker push $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
      docker push $REGISTRY/$SERVICE_NAME:buildcache
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $REGISTRY/$SERVICE_NAME:latest
      fi
  after_script:
    - |
      docker run --rm aquasec/trivy:latest image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --no-progress \
        $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

docker:api-gateway:
  <<: *docker_build
  variables:
    SERVICE_NAME: api-gateway

docker:user-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: user-service

docker:task-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: task-service

docker:solution-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: solution-service

docker:plagiarism-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: plagiarism-service

docker:code-executor-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: code-executor-service

# ──────────────────────────────────────────
# STAGE 3 — деплой через Docker Compose
# ──────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: docker:api-gateway
      artifacts: false
    - job: docker:user-service
      artifacts: false
    - job: docker:task-service
      artifacts: false
    - job: docker:solution-service
      artifacts: false
    - job: docker:plagiarism-service
      artifacts: false
    - job: docker:code-executor-service
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan 94.232.43.131 >> ~/.ssh/known_hosts
  script:
    - ssh bogdan@94.232.43.131 "cd ~/stream-hub && docker compose pull && docker compose up -d"