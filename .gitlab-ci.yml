stages:
  - test
  - docker
  - deploy

variables:
  REGISTRY: registry.gitlab.com/nongrataqqq/stream-hub
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ──────────────────────────────────────────
# STAGE 1 — тесты
# ──────────────────────────────────────────
test:
  stage: test
  image: gradle:8.10-jdk21  # совпадает с Dockerfile
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    SPRING_PROFILES_ACTIVE: test
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/
  script:
    - gradle test --no-daemon --stacktrace

# ──────────────────────────────────────────
# STAGE 2 — сборка и публикация образов
# ──────────────────────────────────────────
.docker_build: &docker_build
  stage: docker
  image: docker:27  # выровнено с dind в test
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"  # только main
    - if: $CI_MERGE_REQUEST_ID         # и MR (для превью)
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --pull \
        --cache-from $REGISTRY/$SERVICE_NAME:latest \
        -f ${SERVICE_NAME}/Dockerfile \
        -t $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA \
        -t $REGISTRY/$SERVICE_NAME:latest \
        .
    - docker push $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    # latest пушим только из main
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $REGISTRY/$SERVICE_NAME:latest
      fi
  after_script:
    # Сканирование на уязвимости
    - docker run --rm aquasec/trivy:latest image
      --exit-code 0
      --severity HIGH,CRITICAL
      --no-progress
      $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA || true

docker:api-gateway:
  <<: *docker_build
  variables:
    SERVICE_NAME: api-gateway

docker:user-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: user-service

docker:task-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: task-service

docker:solution-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: solution-service

docker:plagiarism-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: plagiarism-service

docker:code-executor-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: code-executor-service

# ──────────────────────────────────────────
# STAGE 3 — деплой через Helm
# ──────────────────────────────────────────
.helm_deploy: &helm_deploy
  stage: deploy
  image: alpine/helm:3.17.2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - mkdir -p ~/.kube
    - echo $KUBE_CONFIG_BASE64 | base64 -d > ~/.kube/config

deploy:api-gateway:
  <<: *helm_deploy
  needs: [docker:api-gateway]  # не ждём остальные docker jobs
  variables:
    SERVICE_NAME: api-gateway
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.GATEWAY_KEYCLOAK_CLIENT_SECRET=$GATEWAY_KEYCLOAK_CLIENT_SECRET
      --namespace stream-hub --create-namespace --wait --timeout 5m

deploy:user-service:
  <<: *helm_deploy
  needs: [docker:user-service]
  variables:
    SERVICE_NAME: user-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --namespace stream-hub --create-namespace --wait --timeout 5m

deploy:task-service:
  <<: *helm_deploy
  needs: [docker:task-service]
  variables:
    SERVICE_NAME: task-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --namespace stream-hub --create-namespace --wait --timeout 5m

deploy:solution-service:
  <<: *helm_deploy
  needs: [docker:solution-service]
  variables:
    SERVICE_NAME: solution-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --set secrets.MONGO_ROOT_USERNAME=$SECRET_MONGO_ROOT_USERNAME
      --set secrets.MONGO_ROOT_PASSWORD=$SECRET_MONGO_ROOT_PASSWORD
      --set secrets.SOLUTION_SERVICE_CLIENT_SECRET=$SOLUTION_SERVICE_CLIENT_SECRET
      --namespace stream-hub --create-namespace --wait --timeout 5m

deploy:plagiarism-service:
