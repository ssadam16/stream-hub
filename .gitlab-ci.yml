stages:
  - test
  - docker
  - deploy

variables:
  REGISTRY: registry.gitlab.com/nongrataqqq/stream-hub
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ──────────────────────────────────────────
# STAGE 1 — тесты
# ──────────────────────────────────────────
test:
  stage: test
  image: gradle:8.10-jdk21  # совпадает с Dockerfile
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    SPRING_PROFILES_ACTIVE: test
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/
  script:
    - gradle test --no-daemon --stacktrace --max-workers=1


# ──────────────────────────────────────────
# STAGE 2 — сборка и публикация образов
# ──────────────────────────────────────────
.docker_build: &docker_build
  stage: docker
  image: docker:27  # выровнено с dind в test
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"  # только main
    - if: $CI_MERGE_REQUEST_ID         # и MR (для превью)
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --pull \
        --cache-from $REGISTRY/$SERVICE_NAME:latest \
        -f ${SERVICE_NAME}/Dockerfile \
        -t $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA \
        -t $REGISTRY/$SERVICE_NAME:latest \
        .
    - docker push $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    # latest пушим только из main
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $REGISTRY/$SERVICE_NAME:latest
      fi
  after_script:
    # Сканирование на уязвимости
    - docker run --rm aquasec/trivy:latest image
      --exit-code 0
      --severity HIGH,CRITICAL
      --no-progress
      $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA || true

docker:api-gateway:
  <<: *docker_build
  variables:
    SERVICE_NAME: api-gateway

docker:user-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: user-service

docker:task-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: task-service

docker:solution-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: solution-service

docker:plagiarism-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: plagiarism-service

docker:code-executor-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: code-executor-service

# ──────────────────────────────────────────
# STAGE 3 — деплой через Docker Compose
# ──────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - docker:api-gateway
    - docker:user-service
    - docker:task-service
    - docker:solution-service
    - docker:plagiarism-service
    - docker:code-executor-service
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan 94.232.43.131 >> ~/.ssh/known_hosts
  script:
    - ssh bogdan@94.232.43.131 "cd ~/stream-hub && docker compose pull && docker compose up -d"