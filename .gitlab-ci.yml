stages:
  - test
  - docker
  - deploy

variables:
  REGISTRY: registry.gitlab.com/nongrataqqq/stream-hub

# ──────────────────────────────────────────
# STAGE 1 — тесты
# ──────────────────────────────────────────
test:
  stage: test
  image: gradle:8.14-jdk21
  script:
    - gradle test --no-daemon
  cache:
    key: gradle-cache
    paths:
      - .gradle/
  artifacts:
    when: always
    reports:
      junit: "*/build/test-results/test/*.xml"
    expire_in: 1 hour

# ──────────────────────────────────────────
# STAGE 2 — сборка и публикация Docker образов
# ──────────────────────────────────────────
.docker_build: &docker_build
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --cache-from $REGISTRY/$SERVICE_NAME:latest
      -f ${SERVICE_NAME}/Dockerfile
      -t $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
      -t $REGISTRY/$SERVICE_NAME:latest
      .
    - docker push $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    - docker push $REGISTRY/$SERVICE_NAME:latest

docker:task-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: task-service

docker:solution-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: solution-service

docker:user-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: user-service

docker:api-gateway:
  <<: *docker_build
  variables:
    SERVICE_NAME: api-gateway

docker:code-executor-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: code-executor-service

docker:plagiarism-service:
  <<: *docker_build
  variables:
    SERVICE_NAME: plagiarism-service

# ──────────────────────────────────────────
# STAGE 3 — деплой через Helm
# Секреты берутся из GitLab CI Variables (masked + protected):
#   SECRET_DB_PASSWORD, SECRET_MONGO_ROOT_USERNAME, SECRET_MONGO_ROOT_PASSWORD,
#   GATEWAY_SECRET_KEYCLOAK_CLIENT_SECRET, SOLUTION_SERVICE_CLIENT_SECRET
# ──────────────────────────────────────────
.helm_deploy: &helm_deploy
  stage: deploy
  image: alpine/helm:3.15.0
  before_script:
    - mkdir -p ~/.kube
    - echo $KUBE_CONFIG_BASE64 | base64 -d > ~/.kube/config
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:task-service:
  <<: *helm_deploy
  variables:
    SERVICE_NAME: task-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --namespace stream-hub
      --create-namespace
      --wait
      --timeout 5m

deploy:solution-service:
  <<: *helm_deploy
  variables:
    SERVICE_NAME: solution-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --set secrets.MONGO_ROOT_USERNAME=$SECRET_MONGO_ROOT_USERNAME
      --set secrets.MONGO_ROOT_PASSWORD=$SECRET_MONGO_ROOT_PASSWORD
      --set secrets.SOLUTION_SERVICE_CLIENT_SECRET=$SOLUTION_SERVICE_CLIENT_SECRET
      --namespace stream-hub
      --create-namespace
      --wait
      --timeout 5m

deploy:user-service:
  <<: *helm_deploy
  variables:
    SERVICE_NAME: user-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.DB_PASSWORD=$SECRET_DB_PASSWORD
      --namespace stream-hub
      --create-namespace
      --wait
      --timeout 5m

deploy:api-gateway:
  <<: *helm_deploy
  variables:
    SERVICE_NAME: api-gateway
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.GATEWAY_KEYCLOAK_CLIENT_SECRET=$GATEWAY_KEYCLOAK_CLIENT_SECRET
      --namespace stream-hub
      --create-namespace
      --wait
      --timeout 5m

deploy:plagiarism-service:
  <<: *helm_deploy
  variables:
    SERVICE_NAME: plagiarism-service
  script:
    - helm upgrade --install $SERVICE_NAME ./helm/microservice
      --values ./helm/values/${SERVICE_NAME}.yaml
      --set image.tag=$CI_COMMIT_SHA
      --set secrets.MONGO_ROOT_USERNAME=$SECRET_MONGO_ROOT_USERNAME
      --set secrets.MONGO_ROOT_PASSWORD=$SECRET_MONGO_ROOT_PASSWORD
      --namespace stream-hub
      --create-namespace
      --wait
      --timeout 5m

