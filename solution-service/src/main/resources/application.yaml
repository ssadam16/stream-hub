server:
  port: 8084

spring:
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${SOLUTION_SERVICE_CLIENT_ID:solution-service-client}
            client-secret: ${SOLUTION_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8090/realms/stream-hub/protocol/openid-connect/token}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/stream-hub}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/stream-hub/protocol/openid-connect/certs}

  application:
    name: solution-service

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/solution-service-db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    consumer:
      group-id: solution-group
      properties:
        spring.json.trusted.packages: "com.technokratos.common.events"
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
      retries: 3
      acks: all
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:localhost}:27017/mongo-db?authSource=admin

logging:
  level:
    com.technokratos.solutionservice: DEBUG

security:
  starter:
    permit-all:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /webjars/**
      - /swagger-resources/**
      - /actuator/**

reaper:
  processing-timeout-minutes: 10
  interval-ms: 60000

resilience4j:
  retry:
    instances:
      defaultRetry:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    retryAspectOrder: 2

  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        slidingWindowSize: 40
        failureRateThreshold: 75
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 10
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    circuitBreakerAspectOrder: 1

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_HOST:otel-collector}:4318
  resource:
    attributes:
      service.name: ${spring.application.name}

task-service-uri: ${TASK_SERVICE_URI:http://localhost:8083}
