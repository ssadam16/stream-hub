databaseChangeLog:
  - changeSet:
      id: create-table-posts
      author: nongrataqqq
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: posts_pk
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: comment_count
                  type: bigint
                  defaultValue: "0"
              - column:
                  name: like_count
                  type: bigint
                  defaultValue: "0"
              - column:
                  name: view_count
                  type: bigint
                  defaultValue: "0"
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_posts_user