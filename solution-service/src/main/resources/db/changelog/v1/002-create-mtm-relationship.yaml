databaseChangeLog:
  - changeSet:
      id: create-mtm-users-roles-table
      author: nongrataqqq
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: users_roles_user_fk
                    references: users(id)
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: users_roles_role_fk
                    references: roles(id)
        - addPrimaryKey:
            tableName: users_roles
            columnNames: user_id, role_id
            constraintName: users_roles_pk
      rollback:
        - dropTable:
            tableName: users_roles