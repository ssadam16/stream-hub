services:
  task-service-postgres:
    container_name: task-service-postgres
    image: postgres:latest
    restart: on-failure
    volumes:
      - task-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network
    ports:
      - "5433:5432"

  solution-service-postgres:
    container_name: solution-service-postgres
    image: postgres:latest
    restart: on-failure
    volumes:
      - solution-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: solution-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network
    ports:
      - "5434:5432"

  user-service-postgres:
    container_name: user-service-postgres
    image: postgres:latest
    restart: on-failure
    volumes:
      - user-service-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user-service-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - streamhub-network
    ports:
      - "5432:5432"

  keycloak-postgres:
    image: postgres:latest
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - streamhub-network
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - "5444:5432"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: mongo-db
    volumes:
      - mongo_data:/data/db
    networks:
      - streamhub-network
    healthcheck:
      test: [
        "CMD", "mongosh",
        "--quiet",
        "-u", "${MONGO_ROOT_USERNAME}",
        "-p", "${MONGO_ROOT_PASSWORD}",
        "--authenticationDatabase", "admin",
        "--eval", "db.adminCommand('ping')"
      ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    ports:
      - "27017:27017"

  kafka-1:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://${HOSTNAME:-localhost}:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data1:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network
    ports:
      - "9092:9092"

  kafka-2:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9090,EXTERNAL://${HOSTNAME:-localhost}:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data2:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network
    ports:
      - "9094:9094"

  kafka-3:
    image: bitnamilegacy/kafka:latest
    restart: on-failure
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9090,EXTERNAL://${HOSTNAME:-localhost}:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAMES=PLAINTEXT
    volumes:
      - kafka_data3:/bitnami/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9090", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 100s
    networks:
      - streamhub-network
    ports:
      - "9096:9096"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: true
    ports:
      - "8090:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - streamhub-network
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - streamhub-network

  task-service:
    container_name: task-service
    build:
      context: .
      dockerfile: task-service/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      task-service-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-service-postgres:5432/task-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      SOLUTION_SERVICE_URI: http://solution-service:8084
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/stream-hub
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stream-hub/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - streamhub-network
    ports:
      - "8083:8083"

  solution-service:
    container_name: solution-service
    build:
      context: .
      dockerfile: solution-service/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      solution-service-postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      TASK_SERVICE_URI: http://task-service:8083
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://solution-service-postgres:5432/solution-service-db
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      SOLUTION_SERVICE_CLIENT_SECRET: ${SOLUTION_SERVICE_CLIENT_SECRET}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/stream-hub/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stream-hub/protocol/openid-connect/certs
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - streamhub-network
    ports:
      - "8084:8084"

  code-executor-service:
    container_name: code-executor-service
    build:
      context: .
      dockerfile: code-executor-service/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      consul:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      TASK_SERVICE_URI: http://task-service:8083
      BOOTSTRAP_SERVERS: kafka-1:9090,kafka-2:9090,kafka-3:9090
    networks:
      - streamhub-network
    ports:
      - "8085:8085"

  plagiarism-service:
    container_name: plagiarism-service
    build:
      context: .
      dockerfile: plagiarism-service/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      MONGO_HOST: mongodb
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/stream-hub
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stream-hub/protocol/openid-connect/certs
    networks:
      - streamhub-network
    ports:
      - "8086:8086"

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      user-service-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      OTEL_HOST: otel-collector
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/stream-hub
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stream-hub/protocol/openid-connect/certs
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/user-service-db
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - streamhub-network
    ports:
      - "8081:8081"

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      CONSUL_HOST: consul
      TASK_SERVICE_URI: http://task-service:8083
      PLAGIARISM_SERVICE_URI: http://plagiarism-service:8086
      SOLUTION_SERVICE_URI: http://solution-service:8084
      USER_SERVICE_URI: http://user-service:8081
      GATEWAY_KEYCLOAK_CLIENT_SECRET: ${GATEWAY_KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_URI: ${KEYCLOAK_SERVICE_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_SERVICE_URI}/realms/stream-hub/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: gateway-client
      OTEL_HOST: otel-collector
    networks:
      - streamhub-network
    restart: on-failure

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - streamhub-network
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - streamhub-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - streamhub-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml
    depends_on:
      - tempo
    networks:
      - streamhub-network
    ports:
      - "4318:4318"

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo/config.yaml" ]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    networks:
      - streamhub-network
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - streamhub-network
    ports:
      - "9090:9090"

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - streamhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - streamhub-network

volumes:
  task-service-postgres-data:
  solution-service-postgres-data:
  kafka_data1:
  kafka_data2:
  kafka_data3:
  keycloak_postgres_data:
  mongo_data:
  grafana-data:
  tempo-data:
  prometheus-data:
  user-service-postgres-data:

networks:
  streamhub-network:
    driver: bridge